version: "2"

linters:
  default: all
  disable:
    - lll          # long live the long line
    - gomodguard   # replaced by gomodguard_v2
    - prealloc     # clashes with make zero
    - tagliatelle  # we don't control what third parties use for their API
    - wsl          # replaced by wsl_v5
  exclusions:
    rules:
      - linters:
          - exhaustruct  # tests only populate data as needed
          - funlen       # test functions are long by design
          - goconst      # tests often explicitly reuse values
        path: _test.go
  settings:
    depguard:
      rules:
        lax:
          list-mode: lax
          files:
            - $all
          deny:
            - pkg: sjdaws.com/pkg/testing/connectionmock
              desc: you're doing this the hard way, use repositorymock instead
    ireturn:
      allow:
        - (ar|er|Factory|mock|or)$
        - error
    revive:
      rules:
        - name: package-comments
          disabled: true

formatters:
  enable:
    - gci
    - gofmt
    - gofumpt
    - goimports
  settings:
    gci:
      sections:
        - standard
        - default
        - prefix(sjdaws.com/pkg)
